name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Create wrangler.toml
        env:
          USERNAME: ${{ secrets.USERNAME || '_user' }}
          PASSWORD: ${{ secrets.PASSWORD || '_pass' }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME || 'bucket-webdav' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          with open('wrangler.toml.template', encoding='utf-8') as f:
              config = f.read()

          for key in ('USERNAME', 'PASSWORD', 'BUCKET_NAME'):
              value = json.dumps(os.environ[key], ensure_ascii=False)
              config = config.replace(f'"${key}"', value)

          with open('wrangler.toml', 'w', encoding='utf-8') as f:
              f.write(config)

          print(f"Generated wrangler.toml for bucket: {os.environ['BUCKET_NAME']}")
          PY

      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
